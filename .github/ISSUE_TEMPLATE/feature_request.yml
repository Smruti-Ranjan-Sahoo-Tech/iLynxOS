name: 💡 Feature Request
description: Suggest an idea or enhancement for iLynxOS
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Share your ideas for making iLynxOS even more capable!
  - type: textarea
    id: feature
    attributes:
      label: Feature Proposal
      description: A clear and concise description of the feature you want.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Problem or Use Case
      description: What problem will this solve, or what new workflow does it enable?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Considered Alternatives
      description: Any alternative solutions or workarounds you have considered.
